name: bankpulse-observability

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bankpulse-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
      - bankpulse

  grafana:
    image: grafana/grafana:11.6.0
    container_name: bankpulse-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bankpulse_demo
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: bankpulse-business-panel
      GF_LIVE_ALLOWED_ORIGINS: "${GRAFANA_LIVE_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q database"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - observability
      - bankpulse

  grafana-live-adapter:
    build: ../services/grafana-live-adapter
    container_name: bankpulse-grafana-live-adapter
    environment:
      ANALYTICS_URL: http://business-analytics:8000
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: bankpulse_demo
      CURSOR_PATH: /data/cursor.json
    volumes:
      - grafana-live-adapter-data:/data
    depends_on:
      grafana: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - bankpulse

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: bankpulse-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - observability

networks:
  observability:
    driver: bridge
  bankpulse:
    external: true
    name: bankpulse-network

volumes:
  prometheus-data:
  grafana-data:
  grafana-live-adapter-data:
