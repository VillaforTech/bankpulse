name: BANKdragon V2.1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-contract:
    name: Architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Required deployable services
        run: |
          set -euo pipefail
          for service in payments-api audit-api experiences-api travel-benefits-api events-api social-split-api; do
            test -f "services/$service/Dockerfile"
            test -f "services/$service/pom.xml"
            test -f "services/$service/src/main/resources/application.yml"
          done
          test -f observability/compose.yaml
          test -f observability/prometheus.yml
          test -f observability/grafana/dashboards/bankpulse-overview.json
          test -f docs/architecture/DATA-OWNERSHIP.md
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/styles.css
      - name: Validate compose models
        run: |
          docker compose config --quiet
          docker compose -f observability/compose.yaml config --quiet

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Infrastructure regression tests
        run: python3 -m unittest discover -s tests/infrastructure -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and execute Java tests
        run: |
          for pom in services/*/pom.xml; do mvn -B -f "$pom" test; done
      - name: Test analytics when its component is included
        run: |
          if test -f services/business-analytics/requirements-test.txt; then
            cd services/business-analytics
            pip install -r requirements-test.txt
            python -m pytest tests -q
          else
            echo 'Analytics not included in this foundation branch; full acceptance remains pending.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: '**/surefire-reports/*'
          if-no-files-found: ignore

  integration-test:
    name: Build, integration and observability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
      - name: Build and start BANKdragon V2
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Validate interactive edge UI
        run: |
          curl -fsS http://localhost:8080/ | grep -q "BANKdragon"
          curl -fsS http://localhost:8080/app.js | grep -q "Seat HOLD created"
      - name: Domain and regression smoke tests
        run: bash scripts/smoke-v2.sh
      - name: Start Prometheus and Grafana
        run: docker compose -f observability/compose.yaml up -d prometheus grafana
      - name: Validate observability endpoints
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:9090/-/healthy && break || sleep 2; done
          curl -fsS http://localhost:9090/-/healthy
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break || sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q '"database"'
      - name: Execute integrated team acceptance when supplied
        run: |
          if test -d scripts/acceptance; then
            bash scripts/team-acceptance.sh
          else
            echo 'FOUNDATION VERIFIED ONLY: domain, Live and acceptance contributions are not integrated.'
          fi
      - name: Save run identity and runtime evidence before teardown
        if: always()
        run: |
          mkdir -p artifacts/runtime
          git rev-parse HEAD > artifacts/runtime/tested-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/runtime/run-id.txt
          docker compose ps --all > artifacts/runtime/containers.txt
          docker compose logs --no-color --tail=250 > artifacts/runtime/platform.log 2>&1
          docker compose -f observability/compose.yaml logs --no-color --tail=100 > artifacts/runtime/observability.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: artifacts/
          if-no-files-found: error
      - name: Capture evidence on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=250 || true
          docker compose -f observability/compose.yaml ps || true
          docker compose -f observability/compose.yaml logs --tail=150 || true
      - name: Stop observability
        if: always()
        run: docker compose -f observability/compose.yaml down -v || true
      - name: Stop platform
        if: always()
        run: docker compose down -v || true

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [architecture-contract, unit, integration-test]
    if: ${{ always() }}
    steps:
      - name: Require every CI stage to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-contract.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
        run: |
          set -euo pipefail
          printf 'Architecture: %s\nIntegration: %s\n' "$ARCHITECTURE_RESULT" "$INTEGRATION_RESULT"
          if [[ "$UNIT_RESULT" != "success" || "$ARCHITECTURE_RESULT" != "success" || "$INTEGRATION_RESULT" != "success" ]]; then
            echo "::error::Release blocked: every required stage must succeed; skipped or cancelled stages do not pass."
            exit 1
          fi
