services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command: redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false
    ports: ["127.0.0.1:19092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 20